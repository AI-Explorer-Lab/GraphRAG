[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-graphrag"
version = "0.1.0"
description = "Lineage GraphRAG engine with deterministic lineage graph construction."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "lineage-graphrag team" }
]
dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn>=0.27.0,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "networkx>=3.2.0,<4.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "redis>=5.0.0,<6.0.0",
  "openai>=1.40.0,<2.0.0",
  "faiss-cpu>=1.8.0,<2.0.0",
  "sentence-transformers>=3.0.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
